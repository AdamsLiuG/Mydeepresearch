[project]
name = "helloagents-deep-researcher"
version = "0.0.1"
description = "Fully local web research and summarization assistant powered by HelloAgents."
authors = [
    { name = "Lance Martin" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.23",
    "diskcache>=5.6.3",
    "fastapi>=0.115.0",
    "hello-agents>=0.2.8",
    "huggingface_hub>=0.26.0",
    "tavily-python>=0.5.0",
    "python-dotenv==1.0.1",
    "requests>=2.31.0",
    "openai>=1.12.0",
    "sentence-transformers>=3.0.1",
    "uvicorn[standard]>=0.32.0",
    "ddgs>=9.6.1",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "locust>=2.31.8",
    "mypy>=1.11.1",
    "psutil>=5.9.8",
    "pytest>=8.3.4",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "config", "main", "metrics", "models", "prompts", "utils"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["perf*", "services*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    "D107",
    "D401",
    "D415",
    "D417",
]

[tool.ruff.lint.per-file-ignores]
"evals/run_benchmark.py" = ["E402", "T201"]
"tests/*" = ["E402", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "locust>=2.31.8",
    "psutil>=5.9.8",
    "pytest>=8.3.4",
    "ruff>=0.12.7",
]
