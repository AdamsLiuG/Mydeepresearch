# Replay GRPO recipe for veRL 0.6 in an existing GPU training environment.
# Run from backend/ with a separate held-out export for validation:
# python -m evals.rl_training.train_grpo_trl --export-verl-parquet evals/rl_exports/grpo_step_records.parquet
# python -m evals.rl_training.train_grpo_trl --dataset-path <held-out.jsonl> --export-verl-parquet evals/rl_exports/grpo_validation.parquet
# python -m verl.trainer.main_ppo --config-path "$PWD/evals/rl_training" --config-name verl_grpo_config

defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

data:
  train_files: evals/rl_exports/grpo_step_records.parquet
  val_files: evals/rl_exports/grpo_validation.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1536
  max_response_length: 256
  filter_overlong_prompts: true
  truncation: error
  apply_chat_template_kwargs:
    enable_thinking: false
  train_batch_size: 32
  trust_remote_code: false

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-7B-Instruct
    trust_remote_code: false
    enable_gradient_checkpointing: true
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
  actor:
    optim:
      lr: 5.0e-6
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true
    kl_loss_coef: 0.04
    kl_loss_type: low_var_kl
    clip_ratio: 0.2
    loss_agg_mode: token-mean
  ref:
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    name: vllm
    mode: async
    n: 8
    temperature: 0.8
    top_p: 0.95
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1

custom_reward_function:
  path: evals/rl_training/reward_functions.py
  name: compute_score

trainer:
  total_epochs: 3
  project_name: helloagents-deepresearch-policy
  experiment_name: grpo-policy-v3
  save_freq: 50
  test_freq: 25
  default_local_dir: evals/rl_checkpoints/verl_grpo
