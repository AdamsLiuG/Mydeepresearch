name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Ruff
        run: python -m ruff check backend/src backend/tests backend/evals

      - name: Pytest
        env:
          PYTHONPATH: backend/src
        run: python -m pytest backend/tests -q

      - name: Backend build check
        run: python -m pip wheel ./backend --no-deps -w /tmp/backend-dist

  perf-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Perf smoke benchmark
        working-directory: backend
        run: python -m perf.run_smoke --profile stub --baseline perf/baselines/stub_baseline.json

      - name: Perf load smoke
        working-directory: backend
        run: python -m perf.run_load --profile stub --users 2 --spawn-rate 1 --duration 10s

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke-results
          path: backend/perf/results/

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build check
        working-directory: frontend
        run: npm run build
