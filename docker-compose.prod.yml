# Pass production overrides through the shell or Compose's --env-file.
# For Temporal or ARQ, set WORKFLOW_RUNNER to the profile name and select a
# locally available DEEPRESEARCH_BACKEND_IMAGE with the optional runtime clients.
# Use up --no-build with that image so the default build does not replace it.
x-backend-environment: &backend-environment
  # Set DATABASE_URL explicitly when credentials require URL encoding.
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-deepresearch}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the production stack}@postgres:5432/${POSTGRES_DB:-deepresearch}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SEMANTIC_CACHE_QDRANT_URL: ${SEMANTIC_CACHE_QDRANT_URL:-http://qdrant:6333}
  TEMPORAL_HOST: ${TEMPORAL_HOST:-${TEMPORAL_ADDRESS:-temporal:7233}}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-deepresearch-tasks}
  ARQ_REDIS_URL: ${ARQ_REDIS_URL:-${ARQ_REDIS_DSN:-}}

x-backend-runtime: &backend-runtime
  image: ${DEEPRESEARCH_BACKEND_IMAGE:-helloagents-deepresearch-backend:local}
  pull_policy: never
  env_file:
    - ./backend/.env
  depends_on: &backend-dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend/notes:/app/notes
    - ./backend/.cache:/app/.cache
    - ./backend/.memory:/app/.memory
    - ./backend/.state:/app/.state
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: helloagents-deepresearch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepresearch}
      POSTGRES_USER: ${POSTGRES_USER:-deepresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the production stack}
    volumes:
      - deepresearch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: helloagents-deepresearch-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - deepresearch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: helloagents-deepresearch-qdrant
    volumes:
      - deepresearch_qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    <<: *backend-runtime
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: helloagents-deepresearch-backend
    environment:
      <<: *backend-environment
      WORKFLOW_RUNNER: ${WORKFLOW_RUNNER:-inline}
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: helloagents-deepresearch-frontend
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.25.2
    profiles:
      - temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-deepresearch}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the production stack}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  temporal-worker:
    <<: *backend-runtime
    profiles:
      - temporal
    command: ["python", "-m", "worker.main", "--backend", "temporal"]
    environment:
      <<: *backend-environment
      WORKFLOW_RUNNER: temporal
    depends_on:
      <<: *backend-dependencies
      temporal:
        condition: service_healthy
    healthcheck:
      disable: true

  arq-worker:
    <<: *backend-runtime
    profiles:
      - arq
    command: ["python", "-m", "worker.main", "--backend", "arq"]
    environment:
      <<: *backend-environment
      WORKFLOW_RUNNER: arq
    healthcheck:
      disable: true

volumes:
  deepresearch_pg_data:
  deepresearch_redis_data:
  deepresearch_qdrant_data:
